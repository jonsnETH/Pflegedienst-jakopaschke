        - heading "Was Sie wissen möchten" [level=2] [ref=e193]
      - generic [ref=e194]:
        - generic [ref=e195]:
          - button "Wie schnell kann die Pflege beginnen?" [ref=e196] [cursor=pointer]:
            - text: Wie schnell kann die Pflege beginnen?
            - img [ref=e197]
          - region:
            - paragraph [ref=e199]: In der Regel können wir innerhalb weniger Tage nach dem ersten Gespräch mit der Pflege beginnen. Wir kümmern uns um alle notwendigen Formalitäten und die Absprache mit Ihrer Pflegekasse - damit Sie sich auf das Wesentliche konzentrieren können.
        - generic [ref=e200]:
          - button "Wie läuft die Abrechnung mit der Krankenkasse ab?" [ref=e201] [cursor=pointer]:
            - text: Wie läuft die Abrechnung mit der Krankenkasse ab?
            - img [ref=e202]
          - region:
            - paragraph [ref=e204]: Wir übernehmen die gesamte Abrechnung direkt mit Ihrer Pflege- oder Krankenkasse (SGB XI oder SGB V). Sie müssen sich um nichts kümmern - kein Papierkram, keine komplizierten Formulare. Wir erklären Ihnen beim Erstgespräch, welche Leistungen über Ihre Kasse abgedeckt sind.
        - generic [ref=e205]:
          - button "Kommen immer dieselben Pflegepersonen?" [ref=e206] [cursor=pointer]:
            - text: Kommen immer dieselben Pflegepersonen?
            - img [ref=e207]
          - region:
            - paragraph [ref=e209]: Ja, das ist uns sehr wichtig. Wir bemühen uns, Ihnen ein festes, kleines Pflegeteam zuzuteilen. Vertraute Gesichter geben Sicherheit - besonders in sensiblen Momenten. Nur in Ausnahmefällen (Urlaub, Krankheit) kommen Vertretungen, über die wir Sie selbstverständlich im Voraus informieren.
        - generic [ref=e210]:
          - button "Welche Pflegegrade werden betreut?" [ref=e211] [cursor=pointer]:
            - text: Welche Pflegegrade werden betreut?
            - img [ref=e212]
          - region:
            - paragraph [ref=e214]: Wir betreuen Menschen aller Pflegegrade (1 bis 5). Die genauen Leistungen und der Umfang hängen von Ihrem individuellen Pflegegrad und Ihren Bedürfnissen ab. Haben Sie noch keinen Pflegegrad? Wir helfen Ihnen gerne dabei, den Antrag zu stellen.
        - generic [ref=e215]:
          - button "In welchem Gebiet sind Sie tätig?" [ref=e216] [cursor=pointer]:
            - text: In welchem Gebiet sind Sie tätig?
            - img [ref=e217]
          - region:
            - paragraph [ref=e219]: Wir sind in der Gemeinde Ludwigsfelde und den direkt umliegenden Ortschaften tätig. Rufen Sie uns an, wir klären gemeinsam, ob wir für Sie da sein können.
