        - heading "Pflege mit Würde und Vertrauen" [level=2] [ref=e169]
        - paragraph [ref=e170]: "Pflegedienst Jakopaschke² GmbH entsteht aus dem Wunsch, Pflege so zu gestalten, wie wir sie uns selbst für unsere Angehörigen wünschen würden: menschlich nah, zuverlässig und auf Augenhöhe."
        - generic [ref=e171]: "\"Pflege bedeutet für uns nicht nur Unterstützung - es bedeutet, jemandem das Gefühl zu geben, dass er nicht allein ist.\""
